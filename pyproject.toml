[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-intel"
version = "0.1.0"
description = "Evidence-backed market narrative intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "apscheduler>=3.10",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Alembic autogenerates migrations from its own script.py.mako template
# (typing.Union/Sequence style, etc.); leave generated revisions as Alembic
# writes them rather than hand-reformatting every future migration.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
